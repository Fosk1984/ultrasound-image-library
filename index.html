<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1">

<title>PgCert. MSK Ultrasound Image Bank </title>

<style>

:root{
  --bg:#0b0d10;
  --panel:#14181d;
  --panel2:#1b2027;
  --text:#f4f6f8;
  --muted:#aeb7c2;
  --line:#2b333d;
  --accent:#73b7ff;
  --good:#9be7b1;
  --max:1180px;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;

  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

  background:var(--bg);

  color:var(--text);
}



/* =========================================================
PASSWORD SCREEN
========================================================= */

.gate{

  position:fixed;

  inset:0;

  z-index:9999;

  display:grid;

  place-items:center;

  padding:24px;

  background:#0b0d10;

}

.gate-card{

  width:min(
    440px,
    100%
  );

  background:#14181d;

  border:
    1px solid
    #2b333d;

  border-radius:16px;

  padding:26px;

  box-shadow:
    0 20px 60px
    rgba(
      0,
      0,
      0,
      .45
    );

}

.gate-logo{

  display:block;

  max-width:170px;

  max-height:70px;

  width:auto;

  height:auto;

  margin:
    0 auto
    24px;

  object-fit:contain;

}

.gate-card h2{

  margin:
    0 0 8px;

  font-size:26px;

}

.gate-card p{

  margin:
    0 0 20px;

  color:var(--muted);

  line-height:1.5;

}

.gate-card label{

  display:block;

  margin-bottom:7px;

  font-weight:700;

}

.gate-card input{

  width:100%;

  min-height:48px;

  padding:
    10px 12px;

  border-radius:10px;

  border:
    1px solid
    #3b4653;

  background:#0f1318;

  color:#f4f6f8;

  font-size:16px;

  outline:none;

}

.gate-card input:focus{

  border-color:
    var(--accent);

  box-shadow:
    0 0 0 3px
    rgba(
      115,
      183,
      255,
      .18
    );

}

.gate-card button{

  width:100%;

  min-height:48px;

  margin-top:12px;

  border:0;

  border-radius:10px;

  background:
    var(--accent);

  color:#07111d;

  font-weight:800;

  font-size:16px;

  cursor:pointer;

}

.gate-card button:hover{

  filter:brightness(1.08);

}

.gate-error{

  min-height:22px;

  margin-top:10px;

  color:#ffb4b4;

  font-size:14px;

}

body.locked > header,
body.locked > main,
body.locked > footer{

  visibility:hidden;

}



/* =========================================================
HEADER
========================================================= */

header{

  padding:
    24px 18px;

  border-bottom:
    1px solid
    var(--line);

  background:
    linear-gradient(
      180deg,
      #10141a 0%,
      #0b0d10 100%
    );

}

.wrap{

  max-width:
    var(--max);

  margin:
    0 auto;

}

.header-content{

  display:flex;

  align-items:center;

  justify-content:
    space-between;

  gap:34px;

}

.header-text{

  flex:1;

  min-width:0;

}

h1{

  margin:
    0 0 8px;

  font-size:
    clamp(
      25px,
      4vw,
      39px
    );

  line-height:1.1;

}

.sub{

  margin:0;

  color:
    var(--muted);

  line-height:1.5;

  max-width:760px;

}

.keele-logo{

  display:block;

  width:190px;

  max-width:28%;

  max-height:80px;

  height:auto;

  object-fit:contain;

}



/* =========================================================
MAIN PAGE
========================================================= */

main{

  padding:
    24px 18px
    42px;

}



/* =========================================================
CASE SELECTOR
========================================================= */

.case-tabs{

  display:flex;

  gap:10px;

  flex-wrap:wrap;

  margin:
    0 0 18px;

}

.case-tab{

  appearance:none;

  border:
    1px solid
    var(--line);

  background:
    var(--panel);

  color:
    var(--text);

  border-radius:999px;

  padding:
    10px 15px;

  font-size:15px;

  cursor:pointer;

  min-height:44px;

}

.case-tab:hover{

  border-color:#526171;

}

.case-tab[
  aria-selected="true"
]{

  border-color:
    var(--accent);

  box-shadow:
    0 0 0 2px
    rgba(
      115,
      183,
      255,
      .15
    )
    inset;

}



/* =========================================================
CASE CARD
========================================================= */

.card{

  background:
    var(--panel);

  border:
    1px solid
    var(--line);

  border-radius:16px;

  padding:18px;

}

.case-head{

  display:grid;

  grid-template-columns:
    1fr auto;

  gap:16px;

  align-items:start;

  margin-bottom:14px;

}

.case-head h2{

  margin:
    0 0 6px;

  font-size:24px;

}

.meta{

  color:
    var(--muted);

  margin:0;

  line-height:1.45;

}

.badge{

  border:
    1px solid
    var(--line);

  background:
    var(--panel2);

  border-radius:999px;

  padding:
    8px 11px;

  color:
    var(--muted);

  white-space:nowrap;

}



/* =========================================================
IMAGE COMPARATOR
========================================================= */

.compare{

  position:relative;

  width:100%;

  overflow:hidden;

  border-radius:12px;

  background:#000;

  aspect-ratio:4/3;

  border:
    1px solid
    #000;

  touch-action:pan-y;

  isolation:isolate;

  contain:
    layout paint;

  user-select:none;

  -webkit-user-select:none;

  -webkit-touch-callout:none;

  cursor:ew-resize;

}

.compare img{

  position:absolute;

  inset:0;

  width:100%;

  height:100%;

  object-fit:contain;

  user-select:none;

  -webkit-user-select:none;

  -webkit-user-drag:none;

  pointer-events:none;

  backface-visibility:hidden;

  transform:
    translateZ(0);

}

.after-wrap{

  position:absolute;

  top:0;

  bottom:0;

  left:0;

  width:50%;

  overflow:hidden;

  pointer-events:none;

  will-change:width;

  contain:paint;

}

.after-wrap img{

  position:absolute;

  top:0;

  left:0;

  max-width:none;

  object-fit:contain;

  object-position:
    left center;

  pointer-events:none;

  user-select:none;

  -webkit-user-select:none;

  -webkit-user-drag:none;

  transform:
    translateZ(0);

  backface-visibility:hidden;

}

.divider{

  position:absolute;

  top:0;

  bottom:0;

  left:50%;

  width:3px;

  transform:
    translateX(-50%);

  background:#fff;

  box-shadow:
    0 0 8px
    rgba(
      0,
      0,
      0,
      .75
    );

  pointer-events:none;

}

.knob{

  position:absolute;

  left:50%;

  top:50%;

  transform:
    translate(
      -50%,
      -50%
    );

  width:50px;

  height:50px;

  border-radius:50%;

  background:#fff;

  color:#111;

  display:grid;

  place-items:center;

  font-weight:800;

  font-size:20px;

  box-shadow:
    0 3px 16px
    rgba(
      0,
      0,
      0,
      .4
    );

  pointer-events:none;

}

.labels{

  position:absolute;

  left:12px;

  right:12px;

  top:12px;

  display:flex;

  justify-content:
    space-between;

  pointer-events:none;

  font-weight:700;

  font-size:13px;

  text-shadow:
    0 2px 4px
    rgba(
      0,
      0,
      0,
      .9
    );

}

.labels span{

  background:
    rgba(
      0,
      0,
      0,
      .58
    );

  padding:
    6px 9px;

  border-radius:7px;

}



/* =========================================================
RANGE SLIDER
========================================================= */

.range-row{

  display:grid;

  grid-template-columns:
    auto 1fr auto;

  gap:12px;

  align-items:center;

  margin:
    14px 0 0;

}

input[
  type=range
]{

  width:100%;

  min-height:44px;

  cursor:pointer;

}

.pct{

  font-variant-numeric:
    tabular-nums;

  color:
    var(--muted);

  min-width:46px;

  text-align:right;

}



/* =========================================================
BUTTONS
========================================================= */

.actions{

  display:flex;

  gap:10px;

  flex-wrap:wrap;

  margin-top:14px;

}

button.action{

  appearance:none;

  border:
    1px solid
    var(--line);

  background:
    var(--panel2);

  color:
    var(--text);

  border-radius:10px;

  padding:
    10px 14px;

  min-height:44px;

  font-size:15px;

  cursor:pointer;

}

button.action:hover{

  border-color:
    #526171;

}



/* =========================================================
TEACHING PROMPT
========================================================= */

.prompt{

  margin-top:18px;

  padding:
    15px 16px;

  background:
    var(--panel2);

  border:
    1px solid
    var(--line);

  border-radius:12px;

  line-height:1.55;

}

.prompt strong{

  display:block;

  margin-bottom:6px;

  font-size:16px;

}

.answer{

  display:none;

  margin-top:12px;

  padding:
    12px 14px;

  border-left:
    4px solid
    var(--good);

  background:
    rgba(
      155,
      231,
      177,
      .08
    );

  border-radius:8px;

  line-height:1.5;

}



/* =========================================================
FOOTER
========================================================= */

footer{

  max-width:
    var(--max);

  margin:
    0 auto;

  padding:
    0 18px
    36px;

  color:
    var(--muted);

  font-size:13px;

}



/* =========================================================
MOBILE
========================================================= */

@media(
  max-width:650px
){

  .header-content{

    flex-direction:column;

    align-items:flex-start;

    gap:20px;

  }

  .keele-logo{

    width:150px;

    max-width:60%;

  }

  .case-head{

    grid-template-columns:1fr;

  }

  .badge{

    justify-self:start;

  }

  .card{

    padding:12px;

  }

  .labels{

    font-size:12px;

  }

}

</style>

</head>



<body class="locked">



<!-- ======================================================
PASSWORD SCREEN
====================================================== -->

<div
  class="gate"
  id="passwordGate"
>

<form
  class="gate-card"
  id="passwordForm"
>

<img
  src="images/keele-logo.png"
  alt="Keele University"
  class="gate-logo"
>


<h2>
Student Access
</h2>


<p>
Enter the password supplied by your tutor to access this MSK ultrasound teaching resource.
</p>


<label
  for="sitePassword"
>
Password
</label>


<input
  id="sitePassword"
  type="password"
  autocomplete="current-password"
  required
>


<button
  type="submit"
>
Open Resource
</button>


<div
  class="gate-error"
  id="passwordError"
  aria-live="polite"
>
</div>


</form>

</div>



<!-- ======================================================
HEADER
====================================================== -->

<header>

<div
  class="wrap header-content"
>


<div class="header-text">


<h1>
MSK Ultrasound Image Comparisons
</h1>


<p class="sub">
Choose a case, then drag the slider to compare the unannotated ultrasound image with the annotated teaching image.
</p>


</div>


<img
  src="images/keele-logo.png"
  alt="Keele University"
  class="keele-logo"
>


</div>

</header>



<!-- ======================================================
MAIN CONTENT
====================================================== -->

<main class="wrap">


<div
  id="tabs"
  class="case-tabs"
  role="tablist"
  aria-label="Ultrasound cases"
>
</div>


<section
  id="viewer"
  class="card"
  aria-live="polite"
>
</section>


</main>



<footer>

MSK Ultrasound Teaching Resource

</footer>



<script>



/* =========================================================
PASSWORD

CHANGE THIS PASSWORD IF YOU WANT
========================================================= */

const SITE_PASSWORD =
  "KEELE2026";



/* =========================================================
PASSWORD LOGIC
========================================================= */

const body =
  document.body;


const gate =
  document.getElementById(
    "passwordGate"
  );


const passwordForm =
  document.getElementById(
    "passwordForm"
  );


const passwordInput =
  document.getElementById(
    "sitePassword"
  );


const passwordError =
  document.getElementById(
    "passwordError"
  );



passwordForm.addEventListener(
  "submit",

  function(e){

    e.preventDefault();


    if(
      passwordInput.value
      ===
      SITE_PASSWORD
    ){

      passwordError.textContent =
        "";


      body.classList.remove(
        "locked"
      );


      gate.remove();

    }


    else{

      passwordError.textContent =
        "Incorrect password.";


      passwordInput.select();


      passwordInput.focus();

    }

  }

);



/* =========================================================
ULTRASOUND CASES

ADD NEW CASES HERE
========================================================= */

const cases = [

{

  id:
    "case-01",


  title:
    "Case 1 — 3rd/4th webspace",


  subtitle:
    "Interdigital region",


  plain:
    "images/case-01-plain.png",


  annotated:
    "images/case-01-annotated.jpg",


  prompt:
    "Before revealing the annotations, identify the main structure or abnormality and describe its relationship to the surrounding tissues.",


  teachingNote:
    "Annotated image demonstrates the measured lesion in the 3rd/4th webspace and the course of the interdigital nerve marked by the red arrows."

}


/*

=========================================================

WHEN YOU WANT TO ADD CASE 2

Put a comma after the closing } above.

Then paste something like this:


,{
  id:
    "case-02",

  title:
    "Case 2 — Achilles Tendon",

  subtitle:
    "Insertional Achilles",

  plain:
    "images/case-02-plain.jpg",

  annotated:
    "images/case-02-annotated.jpg",

  prompt:
    "What abnormality can you identify?",

  teachingNote:
    "Insert your teaching explanation here."
}


=========================================================

*/


];



/* =========================================================
SITE CODE
NO NEED TO EDIT BELOW HERE
========================================================= */


const tabs =
  document.getElementById(
    "tabs"
  );


const viewer =
  document.getElementById(
    "viewer"
  );


let activeIndex =
  0;



function renderTabs(){

  tabs.innerHTML =
    "";


  cases.forEach(
    (c,i)=>{


      const button =
        document.createElement(
          "button"
        );


      button.className =
        "case-tab";


      button.type =
        "button";


      button.setAttribute(
        "role",
        "tab"
      );


      button.setAttribute(
        "aria-selected",
        i === activeIndex
          ? "true"
          : "false"
      );


      button.textContent =
        c.title;


      button.addEventListener(
        "click",
        ()=>{


          activeIndex =
            i;


          renderTabs();


          renderCase();

        }
      );


      tabs.appendChild(
        button
      );

    }
  );

}



function renderCase(){


  const c =
    cases[
      activeIndex
    ];


  if(
    !c
  ){

    viewer.innerHTML =
      "<p>No cases have been added yet.</p>";

    return;

  }


  viewer.innerHTML =
  `


  <div class="case-head">


    <div>


      <h2>
        ${escapeHtml(
          c.title
        )}
      </h2>


      <p class="meta">
        ${escapeHtml(
          c.subtitle
        )}
      </p>


    </div>


    <div class="badge">

      ${activeIndex + 1}

      of

      ${cases.length}

    </div>


  </div>



  <div
    class="compare"
    id="compare"
    aria-label="Interactive ultrasound comparison"
  >


    <img
      src="${c.plain}"
      alt="Unannotated ultrasound image"
      draggable="false"
    >



    <div
      class="after-wrap"
      id="afterWrap"
    >


      <img
        src="${c.annotated}"
        alt="Annotated ultrasound image"
        id="afterImg"
        draggable="false"
      >


    </div>



    <div
      class="divider"
      id="divider"
    >
    </div>



    <div
      class="knob"
      id="knob"
    >
      ↔
    </div>



    <div class="labels">


      <span>
        Unannotated
      </span>


      <span>
        Annotated
      </span>


    </div>


  </div>



  <div class="range-row">


    <span>
      Plain
    </span>


    <input
      id="range"
      type="range"
      min="0"
      max="100"
      value="50"
      aria-label="Move comparison slider"
    >


    <span
      class="pct"
      id="pct"
    >
      50%
    </span>


  </div>



  <div class="actions">


    <button
      class="action"
      id="reset"
      type="button"
    >
      Reset slider
    </button>



    <button
      class="action"
      id="showPlain"
      type="button"
    >
      Show plain
    </button>



    <button
      class="action"
      id="showAnnotated"
      type="button"
    >
      Show annotated
    </button>


  </div>



  <div class="prompt">


    <strong>
      Teaching prompt
    </strong>


    ${escapeHtml(
      c.prompt
    )}



    <div class="actions">


      <button
        class="action"
        id="reveal"
        type="button"
      >

        Reveal teaching note

      </button>


    </div>



    <div
      class="answer"
      id="answer"
    >


      ${escapeHtml(
        c.teachingNote
      )}


    </div>


  </div>


  `;



  const compare =
    document.getElementById(
      "compare"
    );


  const range =
    document.getElementById(
      "range"
    );


  const afterWrap =
    document.getElementById(
      "afterWrap"
    );


  const afterImg =
    document.getElementById(
      "afterImg"
    );


  const divider =
    document.getElementById(
      "divider"
    );


  const knob =
    document.getElementById(
      "knob"
    );


  const pct =
    document.getElementById(
      "pct"
    );



  let currentValue =
    50;


  let pendingValue =
    50;


  let animationFrame =
    0;



  function syncImageSize(){


    const rect =
      compare.getBoundingClientRect();


    afterImg.style.width =
      rect.width
      +
      "px";


    afterImg.style.height =
      rect.height
      +
      "px";

  }



  function paint(){


    animationFrame =
      0;


    const value =
      pendingValue;


    currentValue =
      value;


    range.value =
      value;


    afterWrap.style.width =
      value
      +
      "%";


    divider.style.left =
      value
      +
      "%";


    knob.style.left =
      value
      +
      "%";


    pct.textContent =
      Math.round(
        value
      )
      +
      "%";

  }



  function setSlider(
    value
  ){


    pendingValue =
      Math.max(
        0,
        Math.min(
          100,
          Number(
            value
          )
        )
      );


    if(
      !animationFrame
    ){


      animationFrame =
        requestAnimationFrame(
          paint
        );

    }

  }



  syncImageSize();



  window.addEventListener(
    "resize",
    ()=>{


      syncImageSize();


      setSlider(
        currentValue
      );

    }
  );



  range.addEventListener(
    "input",
    e => {


      setSlider(
        e.target.value
      );

    }
  );



  function pointerPosition(
    clientX
  ){


    const rect =
      compare.getBoundingClientRect();


    return (

      (
        clientX
        -
        rect.left
      )

      /

      rect.width

    )

    *

    100;

  }



  let dragging =
    false;



  compare.addEventListener(
    "selectstart",
    e =>
      e.preventDefault()
  );



  compare.addEventListener(
    "dragstart",
    e =>
      e.preventDefault()
  );



  compare.addEventListener(
    "pointerdown",
    e => {


      e.preventDefault();


      if(
        e.pointerType
        ===
        "mouse"

        &&

        e.button
        !==
        0
      ){

        return;

      }


      dragging =
        true;


      compare.setPointerCapture(
        e.pointerId
      );


      setSlider(
        pointerPosition(
          e.clientX
        )
      );

    }
  );



  compare.addEventListener(
    "pointermove",
    e => {


      if(
        !dragging
      ){

        return;

      }


      if(
        e.pointerType
        !==
        "touch"
      ){

        e.preventDefault();

      }


      setSlider(
        pointerPosition(
          e.clientX
        )
      );

    }
  );



  compare.addEventListener(
    "pointerup",
    e => {


      dragging =
        false;


      try{


        compare.releasePointerCapture(
          e.pointerId
        );


      }

      catch(_){}

    }
  );



  compare.addEventListener(
    "pointercancel",
    e => {


      dragging =
        false;


      try{


        compare.releasePointerCapture(
          e.pointerId
        );


      }

      catch(_){}

    }
  );



  document
  .getElementById(
    "reset"
  )
  .addEventListener(
    "click",
    ()=>setSlider(50)
  );



  document
  .getElementById(
    "showPlain"
  )
  .addEventListener(
    "click",
    ()=>setSlider(0)
  );



  document
  .getElementById(
    "showAnnotated"
  )
  .addEventListener(
    "click",
    ()=>setSlider(100)
  );



  const reveal =
    document.getElementById(
      "reveal"
    );


  const answer =
    document.getElementById(
      "answer"
    );



  reveal.addEventListener(
    "click",
    ()=>{


      const visible =
        answer.style.display
        ===
        "block";


      answer.style.display =
        visible
          ?
          "none"
          :
          "block";


      reveal.textContent =
        visible
          ?
          "Reveal teaching note"
          :
          "Hide teaching note";

    }
  );


}



function escapeHtml(
  value
){


  return String(
    value ?? ""
  )
  .replace(
    /[&<>"']/g,

    character =>
    ({
